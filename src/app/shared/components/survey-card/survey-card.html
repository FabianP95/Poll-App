@if (clickable()) {
  <a [routerLink]="['/survey', survey().id]" class="survey-card__inner">
    <span class="survey-card__category">{{ survey().category }}</span>
    <h3 class="survey-card__title">{{ survey().title }}</h3>
    @if (variant() === 'list' && survey().description) {
      <p class="survey-card__description">{{ survey().description }}</p>
    }
    @if (endLabel()) {
      <span class="survey-card__badge">{{ endLabel() }}</span>
    }
  </a>
} @else {
  <article class="survey-card__inner survey-card__inner--static">
    <span class="survey-card__category">{{ survey().category }}</span>
    <h3 class="survey-card__title">{{ survey().title }}</h3>
    @if (endLabel()) {
      <span class="survey-card__badge">{{ endLabel() }}</span>
    }
  </article>
}
