<div class="question-results">
    <div class="question-results__header">
        <span>{{ (questionsArray()?.order ?? 0) + 1 }}.</span>
        <span class="question-results__question">{{questionsArray()?.text}}</span>
    </div>
    @for (answer of questionsArray()?.answers; track $index) {
    <div class="question-results__answers">
        <p>{{answer.letter}}.</p>
        <div class="question-results__answer-bar">
            <div class="question-results__answer-bar-fill" [style.width.%]="(previewVotes(answer) / totalVotes()) * 100">
            </div>
        </div>
        <div class="question-results__answer-percentage">  {{ (previewVotes(answer) / totalVotes()) * 100 | number:'1.0-0' }}%</div>
    </div>
    }
</div>
